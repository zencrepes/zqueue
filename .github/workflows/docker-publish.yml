name: Publish to Registry
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish, such as 2.0.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version
        run: echo "RELEASE_VERSION=${{ github.event.inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            zencrepes/zqueue:latest
            zencrepes/zqueue:${{ env.RELEASE_VERSION }}
          labels: APP_VERSION=${{ env.RELEASE_VERSION }}
          build-args: APP_VERSION_ARG=${{ env.RELEASE_VERSION }}
