name: Lint and test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    container:
      # Matches the runtime image (see Dockerfile).
      image: node:24-alpine

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint:ci

  tests:
    needs: [lint]
    name: Tests
    runs-on: ubuntu-latest

    container:
      image: node:24-alpine

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:cov
      - run: npm run test:e2e

  build:
    needs: [lint, tests]
    name: Build
    runs-on: ubuntu-latest

    container:
      image: node:24-alpine

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
