# Local development dependencies.
#
#   docker compose up -d                            # Redis + OpenSearch (secured)
#   docker compose --profile dashboards up -d       # also start OpenSearch Dashboards on :5601
#
# The host port avoids 9200 on purpose: developers often keep a tunnel to a
# real cluster there.
#
# OpenSearch 3 ships with the security plugin enabled: https with a
# self-signed certificate. zqueue's default configuration already points at
# this stack (https://localhost:9210, user admin, sslVerify false): only the
# password below goes into the configuration file.
services:
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-zQueue!Dev2026}
    ports:
      - '9210:9200'

  # OpenSearch Dashboards (the OpenSearch fork of Kibana), to browse the
  # recorded events. Log in as admin on http://localhost:5601.
  dashboards:
    profiles: ['dashboards']
    image: opensearchproject/opensearch-dashboards:3
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
    ports:
      - '5601:5601'

